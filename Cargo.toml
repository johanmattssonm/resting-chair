[package]
name = "resting-chair"
version = "0.1.0"
description = "REST calls"
license = "MIT"
edition = "2024"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
kaja-web = "1.0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
tauri-wasm = { version = "0.2", features = ["serde"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo = "0.12"
inventory = "0.3"
web-sys = { version = "0.3", features = [
    "Element",
    "HtmlElement",
    "HtmlTextAreaElement",
    "HtmlSelectElement",
    "HtmlInputElement",
    "NodeList",
    "KeyboardEvent",
    "Window",
    "EventTarget",
    "CustomElementRegistry",
    "ElementDefinitionOptions",
] }
